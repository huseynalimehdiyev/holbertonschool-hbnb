<header>
    <img src="images/logo.png" class="logo">
</header>

<main>

<section class="add-review">

<h1>Add Review</h1>

<form id="review-form">

<label>Review</label>

<textarea
    id="review-text"
    required>
</textarea>

<label>Rating</label>

<input
    id="rating"
    type="number"
    min="1"
    max="5"
    required
>

<button type="submit">
    Submit
</button>

</form>

</section>

</main>

<footer>
    <p>All rights reserved</p>
</footer>
